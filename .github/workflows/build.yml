name: Build DolbySoundMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & generate KU100 HRIR header
        run: |
          python3 -m pip install --quiet h5py numpy scipy
          python3 tools/gen_hrir.py dsp/hrir_ku100.hpp

      - name: Run host DSP unit test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Idsp dsp/spatial.cpp dsp/test_dsp.cpp -o test_dsp -lm
          ./test_dsp

      - name: Locate Android NDK & Build-Tools
        run: |
          set -euo pipefail
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
          BT_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          # Prefer a numbered platform (android-35/android-36); codename preview
          # platforms would be picked up by version sort otherwise.
          PLAT_JAR=$(ls -d "$ANDROID_HOME/platforms/android-"*/android.jar 2>/dev/null \
            | grep -E '/android-[0-9]+(\.[0-9]+)?/android\.jar$' | sort -V | tail -n 1)
          [ -n "$PLAT_JAR" ] || PLAT_JAR=$(ls -d "$ANDROID_HOME/platforms/android-"*/android.jar | sort -V | tail -n 1)
          [ -x "$BT_DIR/aidl" ] || { echo "no aidl in $BT_DIR"; exit 1; }
          [ -f "$PLAT_JAR" ] || { echo "no android.jar found"; exit 1; }
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "BT_DIR=$BT_DIR" >> "$GITHUB_ENV"
          echo "PLAT_JAR=$PLAT_JAR" >> "$GITHUB_ENV"
          echo "NDK=$NDK_DIR"
          echo "BT=$BT_DIR"
          echo "JAR=$PLAT_JAR"
          "$BT_DIR/aidl" --help 2>&1 | grep -m1 'built for platform' || true

      # android.hardware.audio.effect pulls types from five other VINTF modules.
      # Every one of them must be in aidl_src/ or the compiler stops with
      # "Couldn't find import for class ...". A missing path fails here loudly
      # instead of being skipped silently by a `|| true`.
      - name: Fetch AOSP AIDL definitions
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/hardware/interfaces aosp_hw_if
          (cd aosp_hw_if && git sparse-checkout set \
            common/aidl/aidl_api \
            common/fmq/aidl/aidl_api \
            audio/aidl/aidl_api)

          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/system/hardware/interfaces aosp_sys_hw_if
          (cd aosp_sys_hw_if && git sparse-checkout set media/aidl_api)

          mkdir -p aidl_src
          copy_pkg() { # $1 = dir holding android/**/*.aidl, $2 = label
            if [ ! -d "$1" ] || [ -z "$(find "$1" -name '*.aidl' -print -quit)" ]; then
              echo "ERROR: AIDL package $2 not found at $1" >&2
              exit 1
            fi
            cp -r "$1"/. aidl_src/
            echo "  + $2 ($(find "$1" -name '*.aidl' | wc -l) aidl files)"
          }

          copy_pkg aosp_hw_if/common/aidl/aidl_api/android.hardware.common/2               android.hardware.common@2
          copy_pkg aosp_hw_if/common/fmq/aidl/aidl_api/android.hardware.common.fmq/1       android.hardware.common.fmq@1
          copy_pkg aosp_hw_if/audio/aidl/aidl_api/android.hardware.audio.common/current    android.hardware.audio.common@current
          copy_pkg aosp_hw_if/audio/aidl/aidl_api/android.hardware.audio.effect/current    android.hardware.audio.effect@current
          copy_pkg aosp_sys_hw_if/media/aidl_api/android.media.audio.common.types/current  android.media.audio.common.types@current
          copy_pkg aosp_sys_hw_if/media/aidl_api/android.media.audio.eraser.types/current  android.media.audio.eraser.types@current

          echo "total AIDL files: $(find aidl_src -name '*.aidl' | wc -l)"

      # The C++ binder headers are NOT part of the NDK (it ships only the C API),
      # but every AIDL-generated header includes <android/binder_interface_utils.h>.
      # AOSP builds vendor AIDL modules from these platform headers.
      - name: Fetch libbinder_ndk C++ headers
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/frameworks/native aosp_frameworks_native
          (cd aosp_frameworks_native && git sparse-checkout set libs/binder/ndk)
          BINDER_INC="$PWD/aosp_frameworks_native/libs/binder/ndk"
          for h in include_cpp/android/binder_interface_utils.h include_cpp/android/binder_auto_utils.h \
                   include_ndk/android/binder_ibinder.h; do
            [ -f "$BINDER_INC/$h" ] || { echo "ERROR: missing binder header $h"; exit 1; }
          done
          echo "BINDER_INC=$BINDER_INC" >> "$GITHUB_ENV"
          ls "$BINDER_INC/include_cpp/android" "$BINDER_INC/include_ndk/android"

      - name: Fetch ONNX Runtime Android (NNAPI) & StemgenRT model
        run: |
          set -euo pipefail
          mkdir -p onnxruntime models
          curl -fsSL -o onnxruntime/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.20.0/onnxruntime-android-1.20.0.aar"
          unzip -q onnxruntime/ort.aar "headers/*" "jni/arm64-v8a/libonnxruntime.so" -d onnxruntime/

          curl -fsSL -o models/vocals.onnx \
            "https://media.githubusercontent.com/media/sweetspotsoundsystem/stemgen-rt/main/model/parallel/vocals.onnx"
          echo "f29a3d8fa596ce4672dd4dc77ccf224f2538389940264aad46ab8168311c2148  models/vocals.onnx" | sha256sum -c -

      # --min_sdk_version=35 is mandatory: VendorExtension.aidl uses
      # ParcelableHolder, which the NDK backend rejects below SDK 31 and refuses
      # at its 29 default.
      - name: Compile AIDL to NDK C++
        run: |
          set -euo pipefail
          mkdir -p aidl_gen/include aidl_gen/src
          "$BT_DIR/aidl" --lang=ndk --structured --stability=vintf --min_sdk_version=35 \
            --omit_invocation \
            -I aidl_src -h aidl_gen/include -o aidl_gen/src \
            $(find aidl_src -name '*.aidl')
          echo "generated sources: $(find aidl_gen/src -name '*.cpp' | wc -l)"
          [ -f aidl_gen/include/aidl/android/hardware/audio/effect/BnEffect.h ] \
            || { echo "ERROR: BnEffect.h was not generated"; exit 1; }

      # One self-contained library: every generated AIDL translation unit goes into
      # liballysoundaidl.so. libc++ is linked statically (the NDK has no libc++.so
      # stub, and the platform .so exports std::__1 while NDK headers emit
      # std::__ndk1), so the only DT_NEEDED entries are system libraries.
      - name: Build liballysoundaidl.so (arm64-v8a)
        run: |
          set -euo pipefail
          NDK_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CXX="$NDK_BIN/aarch64-linux-android35-clang++"
          export FLAGS="-std=c++17 -O2 -fPIC -fvisibility=default -fvisibility-inlines-hidden -DALLY_ENABLE_NPU -Iaidl_gen/include -Idsp -Ieffect -Ionnxruntime/headers -I$BINDER_INC/include_cpp -I$BINDER_INC/include_ndk"
          mkdir -p build_arm64
          rm -f build_arm64/*.o

          cat > compile_one.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          obj="build_arm64/aidl_$(echo "$1" | tr '/' '_').o"
          "$CXX" $FLAGS -c "$1" -o "$obj"
          EOS
          chmod +x compile_one.sh

          find aidl_gen/src -name '*.cpp' | sort | xargs -P "$(nproc)" -n 1 ./compile_one.sh
          mapfile -t objs < <(find build_arm64 -name 'aidl_*.o' | sort)
          echo "compiled ${#objs[@]} AIDL translation units"

          "$CXX" $FLAGS -shared -static-libstdc++ -Wl,--exclude-libs,ALL -Wl,-soname,liballysoundaidl.so \
            "${objs[@]}" dsp/spatial.cpp dsp/vocals.cpp effect/ally_effect.cpp \
            -lbinder_ndk -llog -lm -ldl \
            -o build_arm64/liballysoundaidl.so

          echo "--- DT_NEEDED"
          "$NDK_BIN/llvm-readelf" -d build_arm64/liballysoundaidl.so | grep NEEDED
          echo "--- exported entry points"
          "$NDK_BIN/llvm-nm" -D --defined-only build_arm64/liballysoundaidl.so \
            | grep -E ' (queryEffect|createEffect|destroyEffect)$'
          ls -l build_arm64/liballysoundaidl.so

      - name: Compile AllySoundCtl.dex
        run: |
          set -euo pipefail
          mkdir -p build_java
          javac -source 11 -target 11 -cp "$PLAT_JAR" -d build_java ctl/AllySoundCtl.java
          "$BT_DIR/d8" --min-api 31 --output build_java build_java/*.class
          ls -l build_java

      - name: Package KernelSU Module ZIP
        run: |
          set -euo pipefail
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          VER_STR="v1.0.${GITHUB_RUN_NUMBER}"
          rm -rf dist DolbySoundMod.zip
          mkdir -p dist/module/vendor/lib64/soundfx dist/module/vendor/etc/allysound dist/module/bin
          cp -r module/. dist/module/
          sed -i "s/^version=.*/version=${VER_STR}/" dist/module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${VER_CODE}/" dist/module/module.prop
          cp build_arm64/liballysoundaidl.so dist/module/vendor/lib64/soundfx/liballysoundaidl.so
          cp onnxruntime/jni/arm64-v8a/libonnxruntime.so dist/module/vendor/lib64/libonnxruntime.so
          cp models/vocals.onnx dist/module/vendor/etc/allysound/vocals.onnx
          cp build_java/classes.dex dist/module/bin/AllySoundCtl.dex
          chmod 0755 dist/module/post-fs-data.sh dist/module/service.sh dist/module/uninstall.sh dist/module/bin/check_update.sh
          chmod 0644 dist/module/vendor/lib64/soundfx/liballysoundaidl.so dist/module/vendor/lib64/libonnxruntime.so dist/module/vendor/etc/allysound/vocals.onnx dist/module/bin/AllySoundCtl.dex
          (cd dist/module && zip -r9 ../../DolbySoundMod.zip .)
          unzip -l DolbySoundMod.zip | tail -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolbySoundMod
          path: DolbySoundMod.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DolbySoundMod v1.0.${{ github.run_number }}
          files: DolbySoundMod.zip

      - name: Update update.json on main
        run: |
          set -euo pipefail
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          VER_STR="v1.0.${GITHUB_RUN_NUMBER}"
          cat > update.json <<EOF
          {
            "version": "${VER_STR}",
            "versionCode": ${VER_CODE},
            "zipUrl": "https://github.com/davnozdu/DolbySoundMod/releases/latest/download/DolbySoundMod.zip",
            "changelog": "https://raw.githubusercontent.com/davnozdu/DolbySoundMod/main/README.md"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: bump update.json to ${VER_STR} [skip ci]" || true
          git push
